name: Collect and publish roofline

on:
  schedule:
    # 05:00 / 11:00 / 17:00 UTC. Cron is UTC-only, so these land on
    # 07:00 / 13:00 / 19:00 Berlin in summer and 06:00 / 12:00 / 18:00 in winter.
    - cron: "0 5,11,17 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/collect.yml"

# Least privilege: contents:write only so the data commit can land.
permissions:
  contents: write
  pages: write
  id-token: write

# Never let two runs race on the same data file.
concurrency:
  group: collect-and-publish
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Collect articles
        # Passed as env, not interpolated into the shell, so the value cannot
        # be injected into the command line or leak via `set -x`.
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Verified 2026-09-23 with verify_gemini.py. flash-lite on
          # generateContent enforces the response schema and, unlike the larger
          # models, was not returning 503 "high demand".
          # Also working: GEMINI_API=interactions with gemini-3.6-flash or
          # gemini-3.8-flash (/v1beta/interactions; v1beta2 404s).
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API: generatecontent
        run: python collect_all.py

      - name: Build per-area digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
          GEMINI_API: generatecontent
        # ~6 requests. A failure here must not fail the run: the page treats the
        # digest as optional and simply omits it.
        continue-on-error: true
        run: python build_digest.py --days 7

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # A run rewrites data/*.json wholesale, so a rebase always conflicts on
          # the whole file. Union our fresh data with the remote tip instead, then
          # commit on top of it. Retried because another run can land mid-flight.
          for attempt in 1 2 3; do
            cp data/articles.json /tmp/ours-articles.json
            cp data/rejected.json /tmp/ours-rejected.json 2>/dev/null || true

            git fetch origin "$GITHUB_REF_NAME" --quiet
            git reset --hard "origin/$GITHUB_REF_NAME" --quiet

            # Re-derive through the store so hot/archive rotation is recomputed;
            # merging only the hot file would drop rows that aged into an archive.
            python merge_into_store.py /tmp/ours-articles.json
            if [ -f /tmp/ours-rejected.json ]; then
              python merge_data.py --rejected /tmp/ours-rejected.json data/rejected.json data/rejected.json
            fi

            if git diff --quiet -- data/ && [ -z "$(git ls-files -o --exclude-standard data/)" ]; then
              echo "No data changes after merge; nothing to commit."
              exit 0
            fi

            git add data/
            git commit -m "Update articles [skip ci]"
            if git push; then
              exit 0
            fi
            echo "push rejected; re-merging against the new tip (attempt $attempt)"
          done
          echo "could not push after 3 attempts"
          exit 1

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r site/. _site/
          mkdir -p _site/data
          cp data/articles.json _site/data/
          cp data/digest.json _site/data/ 2>/dev/null || true
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
