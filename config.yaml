# Data sources.
#
# Note on filtering: keyword matching is NOT used to decide relevance any more.
# Sources are retrieval only — cast a wide net here, and let the Gemini
# classifier judge what belongs (see classifier.py). Keywords below exist purely
# to constrain what the upstream APIs return.
sources:
  arxiv:
    enabled: true
    categories: ["cs.LG", "cs.AI", "cs.CL", "cs.AR", "cs.DC", "cs.PF"]
    # Broad retrieval net across the whole stack, not a relevance filter.
    query_terms: [
      # architecture and algorithms
      "transformer architecture", "attention mechanism", "mixture of experts",
      "state space model", "long context", "sparse attention",
      # training
      "pretraining", "optimizer", "scaling law", "distributed training",
      "parallelism", "gradient", "training efficiency",
      # post-training
      "fine-tuning", "reinforcement learning from human feedback",
      "distillation", "preference optimization", "reasoning model",
      # inference
      "LLM inference", "inference optimization", "speculative decoding",
      "KV cache", "batch inference", "inference latency", "inference throughput",
      # serving and systems
      "model serving", "inference engine", "serving system", "scheduling",
      # quantization and compression
      "quantization", "model compression", "pruning", "sparsity",
      # hardware
      "AI accelerator", "GPU", "TPU", "systolic array", "HBM",
      "hardware software co-design", "kernel optimization",
    ]
    max_results: 100

  # Community-curated paper aggregator. Upvotes act as a free pre-filter, so
  # most noise is gone before any classifier call.
  hf_papers:
    enabled: true
    limit: 100
    min_upvotes: 3

  hackernews:
    enabled: true
    # Targeted title searches via the Algolia API, not a top-100 scan. Rejections
    # are remembered in data/rejected.json so each story is judged only once.
    per_query: 20
    min_points: 2
    # HackerNews has no inherent area, but the QUERY that surfaced a story does.
    # Grouping queries by area gives each hit a strong prior for free, which the
    # classifier would otherwise have to infer from a bare title.
    queries:
      inference-engines: [
        "vllm", "sglang", "tensorrt", "llama.cpp", "inference engine",
        "inference server", "llm serving", "ollama", "triton inference",
      ]
      inference-methods: [
        "kv cache", "speculative decoding", "quantization", "flash attention",
        "cuda kernel", "triton kernel", "model inference", "batching",
        "model distillation", "pruning",
      ]
      silicon: [
        "hbm", "tpu", "trainium", "ai accelerator", "gpu cluster", "nvlink",
        "blackwell", "tenstorrent", "cerebras", "groq", "wafer", "interconnect",
      ]
      architecture: [
        "mixture of experts", "state space model", "transformer architecture",
        "attention mechanism", "long context",
      ]
      new-models: [
        "open weights model", "open source llm", "model release",
      ]
      training: [
        "scaling law", "pretraining", "reinforcement learning from human feedback",
        "fine-tuning",
      ]

  rss_feeds:
    enabled: true
    # filter: false  => wholly on-topic source, never dropped on score, but
    #                   still classified so it gets tags.
    feeds:
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "PyTorch Blog"
        url: "https://pytorch.org/blog/feed.xml"
      - name: "Google AI Blog"
        url: "https://research.google/blog/rss/"
      - name: "OpenAI Blog"
        url: "https://openai.com/blog/rss.xml"
      - name: "SemiAnalysis"
        area: silicon
        url: "https://newsletter.semianalysis.com/feed"
        filter: false
      - name: "Microsoft AI"
        url: "https://microsoft.ai/news/feed/"
      - name: "vLLM Blog"
        area: inference-engines
        url: "https://blog.vllm.ai/feed"
        filter: false
      - name: "Together.ai Blog"
        url: "https://www.together.ai/blog/rss.xml"
        filter: false
      - name: "NVIDIA Developer Blog"
        url: "https://developer.nvidia.com/blog/feed/"
      # Silicon microarchitecture deep dives.
      - name: "Chips and Cheese"
        area: silicon
        url: "https://chipsandcheese.com/feed/"
        filter: false
      # Human-curated digests. These are link roundups: one entry points at many
      # articles, so they surface as single cards rather than decomposing.
      - name: "Interconnects"
        area: training
        url: "https://www.interconnects.ai/feed"
        filter: false
      - name: "Ahead of AI"
        url: "https://magazine.sebastianraschka.com/feed"
        filter: false
      - name: "Latent Space"
        url: "https://www.latent.space/feed"

# Relevance. min_score applies to the classifier's score, not keyword matching.
# The keyword lists are the fallback used only when Gemini is unavailable.
relevance:
  min_score: 0.4
  high_value_keywords: [
    "inference", "serving", "latency", "throughput", "performance",
    "quantization", "compression", "optimization", "accelerat",
    "architecture", "training", "fine-tuning", "distillation",
    "GPU", "TPU", "Neuron", "Trainium", "tensor core", "CUDA",
    "batch", "efficiency", "speed", "parallelism", "kernel"
  ]
  bonus_keywords: [
    "KV cache", "speculative decoding", "flash attention", "paged attention",
    "mixture of experts", "scaling law", "state space model",
    "int8", "int4", "fp16", "fp8", "bfloat16", "GPTQ", "AWQ", "GGUF",
    "vLLM", "TensorRT", "SGLang", "TGI", "HBM", "NVLink"
  ]

# Data store. articles.json is the source of truth and is served to the site
# as-is; SQLite exists only in memory for the duration of a collection run.
data:
  path: "data/articles.json"
  rejected_path: "data/rejected.json"
