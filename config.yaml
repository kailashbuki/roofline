# Data sources configuration
sources:
  arxiv:
    enabled: true
    categories: ["cs.LG", "cs.AI", "cs.CL"]
    keywords: [
      "inference optimization", "inference latency", "inference throughput",
      "model serving", "LLM inference", "serving latency", "serving throughput",
      "quantization", "model compression", "pruning", "distillation",
      "KV cache", "speculative decoding", "flash attention", "paged attention",
      "GPU optimization", "GPU inference", "TPU", "tensor core", "CUDA optimization",
      "Neuron", "Trainium", "AI accelerator", "inference accelerator",
      "batch inference", "inference performance", "inference efficiency"
    ]
    max_results: 50

  hackernews:
    enabled: true
    keywords: [
      "inference", "LLM", "quantization", "model serving",
      "vLLM", "TensorRT", "GGUF", "Ollama",
      "GPU", "TPU", "Neuron", "Trainium", "AI accelerator",
      "vision language", "VLM", "multimodal"
    ]
    max_items: 100

  rss_feeds:
    enabled: true
    feeds:
      - name: "Hugging Face Blog"
        url: "https://huggingface.co/blog/feed.xml"
      - name: "PyTorch Blog"
        url: "https://pytorch.org/blog/feed.xml"
      - name: "Google AI Blog"
        url: "https://research.google/blog/rss/"
      - name: "OpenAI Blog"
        url: "https://openai.com/blog/rss.xml"
      - name: "SemiAnalysis"
        url: "https://newsletter.semianalysis.com/feed"
      - name: "Microsoft AI"
        url: "https://microsoft.ai/news/feed/"
      - name: "vLLM Blog"
        url: "https://blog.vllm.ai/feed"
      - name: "Together.ai Blog"
        url: "https://www.together.ai/blog/rss.xml"
      - name: "NVIDIA Developer Blog"
        url: "https://developer.nvidia.com/blog/feed/"

  reddit:
    enabled: false
    subreddits: ["MachineLearning", "LocalLLaMA"]
    keywords: ["inference", "optimization", "quantization"]
    limit: 50

  twitter:
    enabled: false  # Free tier doesn't support timeline access
    # Get credentials from https://developer.twitter.com/en/portal/dashboard
    # Go to your app -> Keys and tokens -> Generate Access Token and Secret
    api_key: "REDACTED_REVOKED_TWITTER_API_KEY"
    api_secret: "REDACTED_REVOKED_TWITTER_API_SECRET"
    access_token: "REDACTED_REVOKED_TWITTER_ACCESS_TOKEN"
    access_token_secret: "REDACTED_REVOKED_TWITTER_TOKEN_SECRET"
    max_tweets: 100
    keywords: ["inference", "optimization", "quantization", "LLM", "model serving"]

# Relevance scoring
relevance:
  high_value_keywords: [
    "inference", "serving", "latency", "throughput", "performance",
    "quantization", "compression", "optimization", "accelerat",
    "GPU", "TPU", "Neuron", "Trainium", "tensor core", "CUDA",
    "batch", "efficiency", "speed"
  ]
  bonus_keywords: [
    "KV cache", "speculative decoding", "flash attention", "paged attention",
    "int8", "int4", "fp16", "bfloat16", "GPTQ", "AWQ", "GGUF",
    "vLLM", "TensorRT", "TGI", "text generation inference"
  ]
  min_score: 0.4

# Database
database:
  path: "articles.db"

# Dashboard
dashboard:
  host: "0.0.0.0"
  port: 8001
  items_per_page: 20

# Scheduler
scheduler:
  collection_times: ["06:00", "12:00", "18:00"]
  timezone: "Europe/Berlin"
