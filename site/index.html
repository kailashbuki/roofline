<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>roofline — what to read in AI performance</title>
  <meta name="description" content="A daily briefing on the AI performance stack: model architecture, new models, inference optimization, inference engines, silicon, training.">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <header>
    <div class="title-row">
      <h1>
        <svg class="mark" viewBox="0 0 32 22" aria-hidden="true">
          <polyline points="3,19 14,4 30,4" fill="none" stroke="currentColor"
                    stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>roofline</h1>
      <span id="updated" class="updated"></span>
      <button id="theme" class="theme" type="button">◐</button>
    </div>

    <div class="controls">
      <select id="window" aria-label="Time range">
        <option value="new" selected>Since last visit</option>
        <option value="2">Last 2 days</option>
        <option value="7">Last 7 days</option>
        <option value="30">Last 30 days</option>
        <option value="90">Last 90 days</option>
      </select>
      <!-- Counts make the filter self-describing; a label alone cannot. -->
      <div id="bar" class="seg" role="group" aria-label="How much to show"></div>
      <input id="search" type="search" placeholder="Search…" aria-label="Search titles">
      <label class="toggle"><input id="unread" type="checkbox"> Unread only</label>
      <button id="mark-all" class="link">Mark all read</button>
    </div>
  </header>

  <!-- Area switching: one click per front, no dropdown. Keys 0-6 too. -->
  <nav id="pills" class="pills" aria-label="Filter by area"></nav>

  <p id="notice" class="notice" hidden></p>

  <main>
    <p id="digest" class="digest" hidden title="Click to expand"></p>
    <!-- The lede: the few things worth opening first, across every area. -->
    <section id="lede-section" class="lede" hidden>
      <h2 class="lede-head">Start here</h2>
      <div id="lede"></div>
    </section>

    <!-- One section per area of interest, in a fixed order. -->
    <div id="areas"></div>

    <p id="empty" class="empty" hidden></p>
  </main>

  <footer>
    <span id="counts"></span>
    <span id="stamp"></span>
    <span>Read state is stored in this browser only.</span>
  </footer>

  <script src="./app.js"></script>
</body>
</html>
